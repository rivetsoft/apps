name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Flatpak builds offline from cargo-sources.json, and its own check runs only on pull
      # requests, so a crate added to Cargo.lock without it is caught here on every push.
      - name: Flatpak crate list matches Cargo.lock
        run: python3 utilities/lib/flatpak-sources-sync.py --check

      # The tests read the desktop's file-type database (shared-mime-info); Rivet Shell's keyboard
      # handling links libxkbcommon, and its lock screen links PAM.
      - name: Install file-type database, keyboard and password libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shared-mime-info libxkbcommon-dev libpam0g-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      # Common mistakes Rust's linter knows about; any warning fails the check.
      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release --locked

      - name: Benchmark (folder timings, no window)
        run: ./target/release/rivet --bench "$GITHUB_WORKSPACE" /usr/share/icons

  # Release artifacts are linked with Zig against glibc 2.31 and smoked on
  # Ubuntu 22.04 (glibc 2.35). A binary that picked up GLIBC_2.43 from a newer
  # host libm, or a library that won't link for that glibc, fails here: every
  # app's AppImage is built and started, as its release would be.
  portable-release:
    name: Portable release (${{ matrix.app }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Every app in ALL_APPS (utilities/lib/apps.sh); Rivet Welcome's catalog test checks that list.
        app: [files, notes, edit, terminal, ftp, snip, shell, vice, calendar, color, fetch, view, welcome]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable

      - name: Cache Zig and bundled library packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/rivet-build
          key: rivet-zig-0.15.1-zigbuild-0.24.1-xkb-jammy

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils squashfs-tools curl ca-certificates xz-utils shared-mime-info librsvg2-bin libpam0g-dev libxkbcommon-dev

      - name: Check the app is listed everywhere the release needs it
        run: |
          . utilities/lib/apps.sh
          case " $ALL_APPS " in *" ${{ matrix.app }} "*) ;; *) echo "::error::${{ matrix.app }} isn't in ALL_APPS"; exit 1 ;; esac

      - name: Build the AppImage (portable binary, bundled keyboard libraries, glibc check)
        run: ./utilities/rivet-dev appimage ${{ matrix.app }}

      - name: Smoke-test on this glibc
        run: |
          set -eu
          . utilities/lib/apps.sh
          app_select ${{ matrix.app }}
          bin=$(RIVET_PKG=$PKG RIVET_BIN=$BIN ./utilities/rivet-dev portable-bin)
          ./utilities/rivet-dev check-glibc --max 2.35 "$bin"
          "$bin" --version | grep -q "$(app_version)"
          image=$(echo dist/*-"$(app_version)"-x86_64.AppImage)
          # No FUSE on the runner: unpack the payload and run it.
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --version | grep -q "$(app_version)"

      - name: Rivet Files' own checks
        if: matrix.app == 'files'
        run: |
          bin=$(./utilities/rivet-dev portable-bin)
          "$bin" --help | grep -q -- '--measure'
          "$bin" --help | grep -q -- '--bench'
          "$bin" --bench "$GITHUB_WORKSPACE"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Rivet_Files-*.AppImage --help | grep -q -- '--export-icons'

  # Builds the Flatpak from this checkout. On a published GitHub release, the
  # bundle is attached next to the AppImage and the tarball.
  flatpak:
    name: Flatpak
    # The Flatpak is Rivet Files': not built for Rivet FTP or Rivet Notes releases.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: rivet-files.flatpak
          manifest-path: apps/rivet-files/packaging/flatpak/io.github.rivetsoft.rivet-files.yml
          cache-key: flatpak-26.08
          # Download the metainfo screenshots into the repo and rewrite their
          # URLs to dl.flathub.org/media, which is what the linter checks for.
          mirror-screenshots-url: https://dl.flathub.org/media

      - name: Lint the manifest and the build
        run: |
          set -eu
          if ! command -v flatpak-builder-lint >/dev/null; then
            flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install -y --noninteractive flathub org.flatpak.Builder
          fi
          # host, host-os and host-etc are errors until Flathub grants an
          # exception. A file manager cannot browse the computer without them.
          # Any other error still fails this job.
          python3 - <<'PY'
          import json, shutil, subprocess, sys
          allowed = {
              "finish-args-host-filesystem-access",
              "finish-args-host-os-filesystem-access",
              "finish-args-host-etc-filesystem-access",
          }
          if shutil.which("flatpak-builder-lint"):
              lint = ["flatpak-builder-lint"]
          else:
              lint = [
                  "flatpak", "run", f"--filesystem={subprocess.check_output(['pwd'], text=True).strip()}",
                  "--command=flatpak-builder-lint", "org.flatpak.Builder",
              ]
          def run(args):
              proc = subprocess.run(lint + args, text=True, capture_output=True)
              print(proc.stdout)
              if proc.stderr:
                  print(proc.stderr, file=sys.stderr)
              if not proc.stdout.strip():
                  sys.exit(proc.returncode or 1)
              try:
                  data = json.loads(proc.stdout)
              except json.JSONDecodeError:
                  sys.exit(proc.returncode or 1)
              unexpected = set(data.get("errors") or []) - allowed
              if unexpected:
                  print("unexpected linter errors:", sorted(unexpected), file=sys.stderr)
                  sys.exit(1)
              print("file-manager permissions pending a Flathub exception:", sorted(set(data.get("errors") or [])))
          run(["manifest", "apps/rivet-files/packaging/flatpak/io.github.rivetsoft.rivet-files.yml"])
          run(["repo", "repo"])
          PY

      - name: Attach the bundle to the GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: rivet-files.flatpak
          tag_name: ${{ github.event.release.tag_name }}
