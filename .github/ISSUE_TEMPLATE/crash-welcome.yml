# Filled in by Rivet Welcome's "Report on GitHub" button after a crash (rivet_xdg::crash).
name: Rivet Welcome crash
description: Rivet Welcome closed unexpectedly or ran into a problem.
title: "Crash in Rivet Welcome"
labels: ["bug", "app: welcome"]
body:
  - type: markdown
    attributes:
      value: Thanks for sending this. Check the report below before you submit it, and remove anything you'd rather not share.
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing when it happened?
      description: Optional, but it often makes the difference.
  - type: textarea
    id: report
    attributes:
      label: Crash report
      render: text
    validations:
      required: true
