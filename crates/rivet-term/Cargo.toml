[package]
name = "rivet-term"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The terminal shared by Rivet apps: a shell in a pseudo-terminal, its screen and scrollback (alacritty_terminal), drawn as an egui widget in the theme's colours"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rivet-look = { path = "../rivet-look" }
eframe = { version = "0.37.0", default-features = false }
alacritty_terminal = { version = "0.26", default-features = false }
libc = "0.2.191"
