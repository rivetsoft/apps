[package]
name = "rivet-cal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Calendars with no interface: events in plain .ics folders (the vdir layout), repeating events, and the events in a span of days"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[dependencies]
rivet-xdg = { path = "../rivet-xdg" }
chrono = "0.4.45"
chrono-tz = "0.10.4"
rrule = "0.14.0"
