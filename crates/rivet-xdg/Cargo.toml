[package]
name = "rivet-xdg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Shared desktop plumbing for Rivet apps: XDG folders, bookmarks and drives, file types (shared-mime-info), default apps and Open With"
license = "MIT OR Apache-2.0"
publish = false

[features]
# The desktop's file picker and its contrast and motion settings, through the portal (needs a
# D-Bus library).
portal = ["dep:zbus"]

[dependencies]
libc = "0.2.191"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }
