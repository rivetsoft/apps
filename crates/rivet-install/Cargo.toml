[package]
name = "rivet-install"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Installing, updating and removing the Rivet apps from their GitHub releases, with no interface: what Rivet Welcome and rivetctl share"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rivet-xdg = { path = "../rivet-xdg" }
# The releases list (GitHub's API answers in JSON).
serde_json = "1"
libc = "0.2.191"
