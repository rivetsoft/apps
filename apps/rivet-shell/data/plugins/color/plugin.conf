# Rivet Color on the panel and in the launcher. The program is Rivet Color itself
# (`rivet-color shell-plugin`, in apps/rivet-color/src/shell.rs): an example of a plugin whose
# icon is a picture it draws (a square of the color picked last), and of a launcher entry that
# takes the words typed (@color #d53f8c copies it in the format chosen in Rivet Color).
name=Color
description=Pick a color from the screen; recent colors on the panel and in the launcher (@color)
author=Rivet
version=1
exec=rivet-color shell-plugin
mode=stream
keyword=color
setting.show_code=toggle|Show the last color's code|Shows the code beside the square on the panel.
