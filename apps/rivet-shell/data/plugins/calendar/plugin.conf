# Rivet Calendar in the shell's calendar. The program is Rivet Calendar itself
# (`rivet-calendar shell-plugin`, in apps/rivet-calendar/src/shell.rs): an example of a plugin
# with no panel item of its own that gives events (`events`) for the month the calendar shows,
# which it's told of (`events=month`).
name=Calendar
description=Rivet Calendar's events, marked on the days of the panel's calendar and listed under it
author=Rivet
version=1
exec=rivet-calendar shell-plugin
mode=stream
events=month
