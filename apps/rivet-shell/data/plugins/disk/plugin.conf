# Disk Space: an example plugin for Rivet Shell (see PLUGINS.md).
name=Disk Space
description=Free space on your disk; click for every disk, and open one
author=Rivet
version=1
exec=./disk.sh /
# Kept running: it prints a line when what it shows changes, and reads what happens.
mode=stream
# The shell's events it wants to hear of, besides clicks on its own item.
events=unlock
