# Rivet Notes on the panel and in the launcher. The program is Rivet Notes itself
# (`rivet-notes shell-plugin`, in apps/rivet-notes/src/shell.rs): an example of a plugin that
# has settings of its own, a menu with headings and tasks, a badge, and a launcher entry.
name=Notes
description=Latest notes and open tasks on the panel, and New Note in the launcher
author=Rivet
version=1
exec=rivet-notes shell-plugin
mode=stream
setting.vault=folder|Vault|The folder of notes to show (empty: the one Rivet Notes had open last)
setting.all_tasks=toggle|Show every task, not only the ones tagged as todos|Without this, only tasks with a todo tag (#task) are listed, as on Notes' Todos page
