# Rivet Notes on the panel and in the launcher. The program is Rivet Notes itself
# (`rivet-notes shell-plugin`, in apps/rivet-notes/src/shell.rs): an example of a plugin that
# has settings of its own, a menu with headings and tasks, a badge, and a launcher entry.
name=Notes
description=Open tasks and latest notes on the panel; find or make notes in the launcher (@notes)
author=Rivet
version=1
exec=rivet-notes shell-plugin
mode=stream
keyword=notes
setting.vault=folder|Vault|The vault Rivet Notes opened last
setting.all_tasks=toggle|Include tasks without a todo tag|When off, only tasks with a todo tag (#task) are listed, as on Notes' Todos page.
