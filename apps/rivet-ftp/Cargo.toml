[package]
name = "rivet-ftp"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A dual-pane file-transfer client (SFTP, FTP, FTPS) for Linux, built on Rivet's core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-ftp"
path = "src/main.rs"

[dependencies]
rivet-connections = { path = "../../crates/rivet-connections" }
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
rivet-media = { path = "../../crates/rivet-media" }
rivet-xdg = { path = "../../crates/rivet-xdg" }
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
serde_json = "1.0.154"
