[package]
name = "rivet-welcome"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Install and update the Rivet apps from their GitHub releases, with a tray icon that checks for new ones"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-welcome"
path = "src/main.rs"

[dependencies]
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
rivet-xdg = { path = "../../crates/rivet-xdg" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# The releases list (GitHub's API answers in JSON).
serde_json = "1"
libc = "0.2.191"
# The tray icon (StatusNotifierItem and its dbusmenu) and notifications.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
