[package]
name = "rivet-calendar"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A calendar kept in plain .ics folders, built on Rivet's core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-calendar"
path = "src/main.rs"

[dependencies]
rivet-cal = { path = "../../crates/rivet-cal" }
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
rivet-xdg = { path = "../../crates/rivet-xdg" }
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
serde_json = "1.0.154"
