[package]
name = "rivet"
version = "0.8.0"
edition = "2024"
# let-chains (`if let … && let …`)
rust-version = "1.88"
description = "A classic Linux file manager, like Nemo, Thunar and Caja, written in Rust/egui — no GTK or Qt"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"

[dependencies]
rivet-xdg = { path = "../../crates/rivet-xdg" }
rivet-look = { path = "../../crates/rivet-look" }
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-media = { path = "../../crates/rivet-media" }
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
libc = "0.2.191"
skrifa = "0.44.0"
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
png = "0.18"
resvg = { version = "0.50.0", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
async-io = "2"
