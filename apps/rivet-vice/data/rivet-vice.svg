<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8799"/>
      <stop offset="1" stop-color="#4a5466"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b556"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>
  </defs>
  <!-- the vice's screw, and the handle through its end -->
  <rect x="8" y="58" width="112" height="12" rx="6" fill="#343c4b"/>
  <rect x="108" y="38" width="10" height="52" rx="5" fill="#343c4b"/>
  <!-- its two jaws -->
  <rect x="16" y="20" width="24" height="88" rx="8" fill="url(#jaw)"/>
  <rect x="80" y="20" width="24" height="88" rx="8" fill="url(#jaw)"/>
  <!-- the box squeezed between them, with a strap around it -->
  <rect x="40" y="36" width="40" height="56" rx="5" fill="url(#box)"/>
  <rect x="55" y="36" width="10" height="56" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="53" y="56" width="14" height="16" rx="3" fill="#8a5410"/>
</svg>
