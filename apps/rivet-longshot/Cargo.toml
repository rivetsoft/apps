[package]
name = "rivet-longshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Look through the pictures in a folder: zoom, turn, slideshows, camera details and animations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-longshot"
path = "src/main.rs"

[dependencies]
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
# Decoding, camera details, thumbnails for the strip, and the stage the light box shares.
rivet-media = { path = "../../crates/rivet-media" }
# File types, default apps, Open With, the trash, and the file picker.
rivet-xdg = { path = "../../crates/rivet-xdg", features = ["portal"] }
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
# Writing a turned picture back in its own format.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
# The local time, for the date a picture was changed.
libc = "0.2.191"

[dev-dependencies]
# Reading back the camera details a saved JPEG carries.
kamadak-exif = "0.6"
