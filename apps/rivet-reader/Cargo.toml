[package]
name = "rivet-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read PDFs and comics: continuous or page by page, with thumbnails, the outline, search and dark pages"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-reader"
path = "src/main.rs"

[dependencies]
# Opening, drawing, reading and searching documents, on a thread of its own.
rivet-doc = { path = "../../crates/rivet-doc" }
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
# The file picker, printing, and opening links.
rivet-xdg = { path = "../../crates/rivet-xdg", features = ["portal"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
