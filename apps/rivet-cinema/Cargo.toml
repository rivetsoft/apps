[package]
name = "rivet-cinema"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Play videos and music from files and folders"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-cinema"
path = "src/main.rs"

[dependencies]
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
# Playback (libmpv, loaded at run time) and the frames the seek bar previews.
rivet-media = { path = "../../crates/rivet-media", features = ["mpv"] }
# File types, folders, the file picker and keeping the screen awake, through the portal.
rivet-xdg = { path = "../../crates/rivet-xdg", features = ["portal"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
# The display mpv shares for hardware decoding.
raw-window-handle = "0.6"
# MPRIS, so media keys and the panel's player controls reach it.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
