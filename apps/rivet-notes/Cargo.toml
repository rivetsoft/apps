[package]
name = "rivet-notes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Markdown notes in plain folders (vaults), with frontmatter and tags, built on Rivet's core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ulinaaron/rivet-files"
publish = false

[[bin]]
name = "rivet-notes"
path = "src/main.rs"

[dependencies]
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
rivet-xdg = { path = "../../crates/rivet-xdg" }
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
