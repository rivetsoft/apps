[package]
name = "rivet-edit"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
description = "A lightweight code editor: folders and files, tree-sitter highlighting, a fuzzy file picker and commands, built on Rivet's core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-edit"
path = "src/main.rs"

[dependencies]
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
rivet-xdg = { path = "../../crates/rivet-xdg" }
rivet-git = { path = "../../crates/rivet-git" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1"
regex = "1"
chrono = "0.4.45"
serde_json = "1"
# The clipboard, for Paste in the right-click menu (the same one egui uses).
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
