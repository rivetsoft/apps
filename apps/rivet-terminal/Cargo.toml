[package]
name = "rivet-terminal"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "A terminal with tabs and split panes, in the Rivet apps' look: theme colours or a colour scheme, built on Rivet's core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-terminal"
path = "src/main.rs"

[dependencies]
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
rivet-term = { path = "../../crates/rivet-term" }
rivet-xdg = { path = "../../crates/rivet-xdg" }
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
# Reading the clipboard for Ctrl+Shift+V (the same one egui uses).
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
