[package]
name = "rivetctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Install, update and build the Rivet apps from the terminal, in a full-screen list or one command at a time, and let AI assistants do the same through MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivetctl"
path = "src/main.rs"

[dependencies]
# The engine Rivet Welcome runs on: the same releases, channels, installs and lock.
rivet-install = { path = "../../crates/rivet-install" }
rivet-xdg = { path = "../../crates/rivet-xdg" }
# --json output and the MCP server's JSON-RPC messages.
serde_json = "1"
libc = "0.2.191"
# The full-screen list (MIT). It redraws only what changed, lays out the table, gauges and
# dialogs, and its test backend draws a screen in memory for checks. crossterm (MIT) is its
# terminal side: raw mode, the alternate screen and key events.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
