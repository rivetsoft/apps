[package]
name = "rivet-greeter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A login screen for greetd that looks like Rivet Shell's lock screen, over the wallpaper each person chose last"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rivetsoft/apps"
publish = false

[[bin]]
name = "rivet-greeter"
path = "src/main.rs"

[dependencies]
rivet-lockscreen = { path = "../../crates/rivet-lockscreen" }
rivet-kit = { path = "../../crates/rivet-kit" }
rivet-look = { path = "../../crates/rivet-look" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# greetd's messages.
serde_json = "1"
