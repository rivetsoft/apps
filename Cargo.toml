# Rivet Apps: one workspace, several apps, shared crates.
#   apps/rivet-files   Rivet Files, the file manager (the `rivet` program)
#   apps/rivet-ftp     Rivet FTP (early alpha)
#   apps/rivet-notes   Rivet Notes (early alpha)
#   apps/rivet-edit    Rivet Edit, the code editor
#   apps/rivet-terminal  Rivet Terminal (tabs and split panes; the terminal is crates/rivet-term)
#   apps/rivet-shell   Rivet Shell (panel, dock, widgets, wallpaper for Wayland)
#   apps/rivet-welcome Rivet Welcome (installs and updates the apps; a tray icon)
#   apps/rivet-snip    Rivet Snip (clips and marks up screenshots)
#   apps/rivet-fetch   rivetfetch (the computer at a glance in the terminal)
#   apps/rivet-calendar Rivet Calendar (events in plain .ics folders; the panel's calendar)
#   apps/rivet-color   Rivet Color (picks colors from the screen; shades, harmonies, palettes)
#   apps/rivet-longshot    Rivet Long Shot (looks through the pictures in a folder)
#   apps/rivet-reader    Rivet Reader (reads PDFs and comics; the documents are crates/rivet-doc)
#   apps/rivet-cinema    Rivet Cinema (video and music player, through libmpv loaded at run time)
#   apps/rivetctl      rivetctl (installs, updates and builds the apps from the terminal; MCP)
#   crates/*           pieces the apps share
# Plain `cargo build` / `cargo run` builds Rivet Files; use `-p rivet-ftp` or
# `-p rivet-notes` for the others, or `--workspace` for everything.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["apps/rivet-files"]

# Debug builds run close to release speed and still rebuild as fast: our own crates at
# opt-level 1 (keeping debug assertions and debuginfo), dependencies at 2, compiled once and
# cached. Numbers in docs/development.md.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The software renderer (screenshots, Rivet Shell) is slow unoptimised, even in debug builds.
[profile.dev.package.rivet-kit]
opt-level = 3

# Calendars of thousands of events (a work Google account) take seconds to read unoptimised.
[profile.dev.package.rivet-cal]
opt-level = 3

# Dark pages recolor every pixel of a page, and comic pages are scaled here.
[profile.dev.package.rivet-doc]
opt-level = 3

[profile.release]
opt-level = 3

# What the release downloads (archive, AppImage) are built with, through
# utilities/lib/portable-build.sh: 13–20% smaller binaries for about 30% more build time.
# Builds from source (cargo build --release, rivet-dev install, AUR, Flatpak) keep release.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
