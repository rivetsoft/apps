<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>Rivet's mascot</title>
  <!-- A rivet leaning on a folder, the way Clippy leans on its page. The body is kept short and
       wide, pearly silver rather than pink, so it reads as a rivet and nothing else. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeef5"/>
      <stop offset="1" stop-color="#f7d6e7"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef7ab5"/>
      <stop offset="1" stop-color="#d53f8c"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8487f"/>
      <stop offset="1" stop-color="#8e2f60"/>
    </linearGradient>
    <!-- Pearly silver, lit from the upper left like the logo's rivet. -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4bdcf"/>
      <stop offset="0.22" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e9e5ee"/>
      <stop offset="1" stop-color="#9d95ad"/>
    </linearGradient>
    <linearGradient id="underDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3f5c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4b3f5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pinkBounce" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb65a6" stop-opacity="0"/>
      <stop offset="1" stop-color="#eb65a6" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.35" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f1eef5"/>
      <stop offset="1" stop-color="#ada5bd"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a39bb3"/>
      <stop offset="0.4" stop-color="#ddd8e5"/>
      <stop offset="1" stop-color="#8c839f"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#f4f2f6"/>
      <stop offset="1" stop-color="#d6d1dc"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="bodyClip">
      <rect x="366" y="236" width="108" height="196" rx="30"/>
    </clipPath>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>

  <g transform="translate(-40 20)">
    <!-- The folder he leans on, like the one in Rivet's logo. -->
    <g transform="rotate(-9 600 360)">
      <rect x="610" y="206" width="150" height="70" rx="18" fill="url(#folderBack)"/>
      <rect x="404" y="232" width="382" height="282" rx="26" fill="url(#folderBack)"/>
      <rect x="404" y="262" width="382" height="252" rx="26" fill="url(#folderFront)"/>
      <rect x="404" y="262" width="382" height="18" rx="9" fill="#ffffff" opacity="0.25"/>
    </g>

    <!-- His shadow on the folder. -->
    <ellipse cx="520" cy="452" rx="105" ry="22" fill="#6e2448" opacity="0.35" filter="url(#soft)" transform="rotate(-10 520 452)"/>

    <g transform="rotate(7 420 320)">
      <!-- Body: short and wide, with the shade under the dome and pink thrown up by the folder. -->
      <rect x="366" y="236" width="108" height="196" rx="30" fill="url(#body)"/>
      <g clip-path="url(#bodyClip)">
        <rect x="366" y="236" width="108" height="36" fill="url(#underDome)"/>
        <rect x="440" y="236" width="34" height="196" fill="url(#pinkBounce)"/>
        <rect x="380" y="262" width="13" height="152" rx="6.5" fill="#ffffff" opacity="0.75"/>
      </g>
      <rect x="366" y="236" width="108" height="196" rx="30" fill="none" stroke="#8a8199" stroke-width="3"/>

      <!-- Head: the dome, worn like a hat, on a bevelled rim. -->
      <ellipse cx="420" cy="240" rx="126" ry="20" fill="url(#rim)" stroke="#8a8199" stroke-width="2"/>
      <path d="M296 236 C296 130 544 130 544 236 C544 252 296 252 296 236 Z" fill="url(#dome)" stroke="#8a8199" stroke-width="3"/>
      <path d="M328 196 C340 160 390 148 428 152" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

      <!-- Eyebrows on the rim: one raised, the knowing look. -->
      <path d="M344 222 Q368 190 398 206" fill="none" stroke="#24192c" stroke-width="11" stroke-linecap="round"/>
      <path d="M442 214 Q468 204 496 220" fill="none" stroke="#24192c" stroke-width="11" stroke-linecap="round"/>

      <!-- Eyes: wider than the body, as googly eyes should be. -->
      <ellipse cx="382" cy="290" rx="36" ry="40" fill="#4b3f5c" opacity="0.18" transform="translate(3 5)"/>
      <ellipse cx="460" cy="288" rx="36" ry="40" fill="#4b3f5c" opacity="0.18" transform="translate(3 5)"/>
      <ellipse cx="382" cy="290" rx="36" ry="40" fill="url(#eye)" stroke="#8c7d92" stroke-width="2"/>
      <ellipse cx="460" cy="288" rx="36" ry="40" fill="url(#eye)" stroke="#8c7d92" stroke-width="2"/>
      <ellipse cx="394" cy="297" rx="15" ry="18" fill="#1b1220"/>
      <ellipse cx="472" cy="295" rx="15" ry="18" fill="#1b1220"/>
      <circle cx="400" cy="289" r="5" fill="#ffffff"/>
      <circle cx="478" cy="287" r="5" fill="#ffffff"/>

      <!-- A lopsided grin and a blush. -->
      <path d="M398 352 Q426 378 450 344" fill="none" stroke="#24192c" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="388" cy="342" rx="10" ry="6" fill="#eb65a6" opacity="0.45"/>
      <ellipse cx="460" cy="336" rx="10" ry="6" fill="#eb65a6" opacity="0.45"/>
    </g>

    <!-- A glint off the dome. -->
    <path d="M300 112 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7 z" fill="#ffffff"/>
    <path d="M262 160 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4 z" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
